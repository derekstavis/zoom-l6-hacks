[package]
name = "l6max-gui"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
headless-screenshots = ["gpui/test-support", "gpui_platform/test-support"]

[[example]]
name = "render_ui"
required-features = ["headless-screenshots"]

[dependencies]
tracing.workspace = true
smoke-core = { path = "../../tools/smoke-core" }
l6max-host.workspace = true
l6fw.workspace = true
firmware-patch-core.workspace = true
sha2.workspace = true
libc.workspace = true
image.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit"] }
gpui-kit-assets = "0.10.0"
gpui-component = "0.10.0"
smallvec = "1.15"

# GPUI selects Linux window-system backends by feature; none is on by default.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "wayland"] }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSWindow", "NSApplication", "NSOpenPanel", "NSSavePanel", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }
objc2 = "0.6"

[lints]
workspace = true
