version = 1
name = "sd-effect-assignment-plateau-plateau"
models = ["l6max"]
backends = ["headless"]
state = "effects-room"
sd_patches = []
sd_bundle_mode = "composed-module"
effect_replacements = { room = "plateau", spring = "plateau" }
gdb = true

[case]
suites = ["sd-matrix", "effect-replacement-matrix"]
wall_timeout_s = 600

[[audio_input]]
channel = 1
loop-tone = { hz = 440.0, seconds = 1.0, amplitude = 0.1 }

[[step]]
action = "include"
path = "patches/efx-loader/tests/emulator/fragments/effect-replacement-load.toml"

[[step]]
action = "effect-replacement-state"
expected_effect_type = 1
expected_processor_type = 1

[[step]]
action = "press"
control = "efx-select"

[[step]]
action = "delay"
guest_ms = 500

[[step]]
action = "effect-replacement-state"
expected_effect_type = 2
expected_processor_type = 2
