version = 1
name = "sd-effect-editor-mode-restore"
models = ["l6max"]
backends = ["headless"]
state = "effects-room"
sd_patches = []
sd_bundle_mode = "composed-module"
effect_replacements = { room = "plateau" }
gdb = true

[case]
suites = ["sd-matrix", "effect-replacement-matrix"]
wall_timeout_s = 600

[[step]]
