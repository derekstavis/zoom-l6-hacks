version = 1
name = "sd-effect-replacement-plateau"
models = ["l6max"]
backends = ["headless"]
state = "effects-room"
sd_patches = []
sd_bundle_mode = "composed-module"
effect_replacements = { room = "plateau" }

[case]
suites = ["sd-matrix", "effect-replacement-matrix"]
wall_timeout_s = 600

[[audio_input]]
channel = 1
loop-tone = { hz = 440.0, seconds = 1.0, amplitude = 0.1 }

[[step]]
action = "include"
path = "patches/efx-loader/tests/emulator/fragments/effect-replacement-load.toml"

[[step]]
action = "wait-effect-slot"
expected_effect_type = 1
expected_processor_type = 1
require_output = true

[[step]]
action = "effect-replacement-state"
expected_effect_type = 1
expected_processor_type = 1
require_output = true

[[step]]
action = "press"
control = "tap-button"

[[step]]
action = "wait-effect-mode"
edit_mode = true

[[step]]
action = "capture-effect-state"

[[step]]
action = "expect-effect-type"
value = 1

[[step]]
action = "expect-effect-processor"
value = 1

[[step]]
action = "expect-effect-edit-mode"
enabled = true

[[step]]
action = "effect-state-end"

[[step]]
action = "capture-effect-ring"
encoder = 1

[[step]]
action = "effect-paced-turn"
channel = 1
steps = 1

[[step]]
action = "expect-effect-ring-changed"
encoder = 1

[[step]]
action = "expect-display-image"
image = "patches/efx-loader/tests/emulator/references/effect-plateau-parameter.png"

[[step]]
action = "capture-effect-state"
edits = true
dialog = true

[[step]]
action = "expect-effect-type"
value = 1

[[step]]
action = "expect-effect-processor"
value = 1

[[step]]
action = "expect-effect-edit-mode"
enabled = true

[[step]]
action = "expect-effect-edits"
minimum = 1

[[step]]
action = "expect-effect-dialog"
active = true

[[step]]
action = "effect-state-end"

[[step]]
action = "press"
control = "tap-button"

[[step]]
action = "wait-effect-mode"
edit_mode = false

[[step]]
action = "capture-effect-state"

[[step]]
action = "expect-effect-type"
value = 1

[[step]]
action = "expect-effect-processor"
value = 1

[[step]]
action = "expect-effect-edit-mode"
enabled = false

[[step]]
action = "effect-state-end"

[[step]]
action = "press"
control = "efx-select"

[[step]]
action = "wait-effect-slot"
expected_effect_type = 2
expected_processor_type = 0

[[step]]
action = "capture-effect-state"

[[step]]
action = "expect-effect-type"
value = 2

[[step]]
action = "expect-effect-processor"
value = 0

[[step]]
action = "effect-state-end"
