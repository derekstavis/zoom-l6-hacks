version = 1
name = "knob-dialog"
models = ["l6max"]
backends = ["headless"]
patches = ["knob-dialog"]
card = "recorder-project"
gdb = true

[case]
suites = ["full"]
volatile = true
no_sd = true

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "expect-display-image"
image = "tests/smoke/images/l6max-recorder-no-sd.png"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "knob-dialog-ready"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog"
guest_timeout_ms = 180000
wall_timeout_s = 600
