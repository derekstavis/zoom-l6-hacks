version = 1
name = "sd-knob-dialog-dynamic"
models = ["l6max"]
backends = ["headless"]
gdb = true
sd_patches = ["knob-dialog"]
sd_bundle_mode = "ordered-chain"

[case]
suites = ["sd-matrix"]
wall_timeout_s = 1200

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "expect-sd-patch"
loaded = true
chain_count = 2

[[step]]
action = "knob-dialog-ready"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog-guard"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog-baseline"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog-preflight-begin"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog-preflight-descriptor"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog-preflight-text-alias"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog-preflight-layer-collision"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog-preflight-widget-layer"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog-preflight-background-layer"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog"
guest_timeout_ms = 180000
wall_timeout_s = 600
