version = 1
name = "sd-knob-dialog"
models = ["l6max"]
backends = ["headless"]
gdb = true
patches = ["knob-dialog"]
sd_patches = []

[case]
suites = ["sd-matrix"]
wall_timeout_s = 1200

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "expect-display-image"
image = "tests/emulator/references/l6max-recorder-home.png"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "wait"
until = "sd-patch-empty"

[[step]]
action = "expect-sd-patch"
loaded = false

[[step]]
action = "knob-dialog-ready"
guest_timeout_ms = 180000
wall_timeout_s = 600
