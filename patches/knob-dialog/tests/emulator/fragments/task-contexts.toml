wall_timeout_s = 600

[[step]]
action = "knob-task-wait-hook"
guest_timeout_ms = 180000
wall_timeout_s = 600

[[step]]
action = "knob-task-arm-callback"
guest_timeout_ms = 180000
wall_timeout_s = 600

[[step]]
action = "knob-task-wait-callback"
guest_timeout_ms = 180000
wall_timeout_s = 600

[[step]]
action = "knob-task-assert-distinct"
guest_timeout_ms = 180000
wall_timeout_s = 600

[[step]]
action = "knob-task-release"
