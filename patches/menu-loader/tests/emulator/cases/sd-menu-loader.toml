version = 1
name = "sd-menu-loader"
models = ["l6max"]
backends = ["headless"]
patches = ["menu-loader", "knob-dialog"]
sd_patches = ["midi-sync"]

[case]
suites = ["sd-matrix"]
wall_timeout_s = 1500

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
models = ["l6max"]
action = "expect-display-image"
image = "tests/emulator/references/l6max-recorder-home.png"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "wait"
until = "sd-patch-loaded"

[[step]]
action = "checkpoint"
name = "home"

[[step]]
action = "expect-sd-loader"

[[step]]
action = "capture-sd-module"
loaded = true

[[step]]
action = "expect-sd-allocation"
loaded = true

[[step]]
action = "expect-sd-module"
loaded = true

# Menu > System (main menu index 7).

[[step]]
action = "press"
control = "recorder-function-1"

[[step]]
action = "expect-display-image"
image = "tests/smoke/images/l6max-sound-assign/menu-project.png"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "expect-display-image"
image = "tests/smoke/images/l6max-patch-menu/main-system.png"

[[step]]
action = "press"
control = "recorder-function-4"

[[step]]
action = "expect-display-image"
image = "tests/smoke/images/l6max-patch-menu/system-first-9.png"

# System index 7 is Patches, after the seven stock items.

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "expect-display-image"
image = "patches/menu-loader/tests/emulator/references/system-patches.png"

[[step]]
action = "checkpoint"
name = "system-patches"

[[step]]
action = "press"
control = "recorder-function-4"

[[step]]
action = "expect-display-image"
image = "patches/menu-loader/tests/emulator/references/patches-top.png"

[[step]]
action = "checkpoint"
name = "patches-top"

# Down three times scrolls the list to rows 1-3; Up then selects
# knob-dialog, leaving the SD module's row visible and unselected, so its
# long title does not scroll.

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-2"

[[step]]
action = "expect-display-image"
image = "patches/menu-loader/tests/emulator/references/patches-sd-row.png"

[[step]]
action = "checkpoint"
name = "patches-sd-row"

# Back to System; midi-sync declares the item after Patches.

[[step]]
action = "press"
control = "recorder-function-1"

[[step]]
action = "expect-display-image"
image = "patches/menu-loader/tests/emulator/references/system-patches.png"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "expect-display-image"
image = "patches/menu-loader/tests/emulator/references/system-send-midi-state.png"

[[step]]
action = "checkpoint"
name = "system-send-midi-state"
