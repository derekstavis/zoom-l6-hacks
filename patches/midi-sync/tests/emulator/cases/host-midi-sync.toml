version = 1
name = "host-midi-sync"
models = ["l6max"]
card = "none"
backends = ["headless"]
patches = ["midi-sync"]

[case]
suites = ["full"]
no_sd = true
wall_timeout_s = 900

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "include"
path = "tests/emulator/fragments/l6max-first-boot-no-sd.toml"

[[step]]
action = "include"
path = "tests/emulator/fragments/host-midi-native-round-trip.toml"

[[step]]
action = "include"
path = "patches/midi-sync/tests/emulator/fragments/request-state.toml"
