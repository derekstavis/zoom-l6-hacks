version = 1
name = "host-midi-sync"
models = ["l6max"]
card = "none"
backends = ["headless"]
patches = ["midi-sync"]

[case]
suites = ["full"]
no_sd = true
wall_timeout_s = 900

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "include"
path = "tests/emulator/fragments/l6max-first-boot-no-sd.toml"

[[step]]
action = "host-midi-round-trip"
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "host-midi-sync"
guest_timeout_ms = 30000
wall_timeout_s = 120
