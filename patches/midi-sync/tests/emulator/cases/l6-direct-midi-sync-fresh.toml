version = 1
name = "l6-direct-midi-sync-fresh"
models = ["l6"]
card = "none"
state = "none"
backends = ["headless"]
patches = ["midi-sync"]

[case]
suites = []
volatile = true
no_sd = true
wall_timeout_s = 900

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "include"
path = "tests/emulator/fragments/l6-first-boot-setup.toml"

[[step]]
action = "include"
path = "tests/emulator/fragments/host-midi-direct-cable-1.toml"

[[step]]
action = "include"
path = "patches/midi-sync/tests/emulator/fragments/request-state.toml"

[[step]]
action = "include"
path = "patches/midi-sync/tests/emulator/fragments/l6-indicators.toml"
