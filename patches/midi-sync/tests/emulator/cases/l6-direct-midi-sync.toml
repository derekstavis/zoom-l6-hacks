version = 1
name = "l6-direct-midi-sync"
models = ["l6"]
card = "none"
backends = ["headless"]
patches = ["midi-sync"]

[case]
suites = ["full"]
volatile = true
no_sd = true
wall_timeout_s = 900

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "include"
path = "tests/emulator/fragments/l6-first-boot-setup.toml"

[[step]]
action = "direct-usb-midi-round-trip"
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "host-midi-sync"
guest_timeout_ms = 30000
wall_timeout_s = 120

[[step]]
action = "l6-midi-ring-pin-sweep"
cc = 83
guest_timeout_ms = 7000
wall_timeout_s = 30

[[step]]
action = "l6-midi-ring-pin-sweep"
cc = 84
guest_timeout_ms = 7000
wall_timeout_s = 30

[[step]]
action = "l6-midi-ring-pin-sweep"
cc = 85
guest_timeout_ms = 7000
wall_timeout_s = 30

[[step]]
action = "l6-midi-ring-pin-sweep"
cc = 86
guest_timeout_ms = 7000
wall_timeout_s = 30

[[step]]
action = "l6-midi-ring-pin-sweep"
cc = 87
guest_timeout_ms = 7000
wall_timeout_s = 30

[[step]]
action = "l6-midi-ring-pin-sweep"
cc = 88
guest_timeout_ms = 7000
wall_timeout_s = 30

[[step]]
action = "l6-midi-mute-indicators"
guest_timeout_ms = 7000
wall_timeout_s = 30
