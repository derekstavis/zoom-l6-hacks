version = 1
name = "l6-midi-sync"
models = ["l6"]
card = "none"
backends = ["headless"]
patches = ["midi-sync"]

[case]
suites = ["full"]
volatile = true
no_sd = true
wall_timeout_s = 180

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "include"
path = "tests/emulator/fragments/l6-first-boot-setup.toml"

[[step]]
action = "l6-midi-sync"
guest_timeout_ms = 15000
wall_timeout_s = 180
