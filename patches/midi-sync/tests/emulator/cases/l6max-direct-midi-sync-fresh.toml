version = 1
name = "l6max-direct-midi-sync-fresh"
models = ["l6max"]
card = "none"
state = "none"
backends = ["headless"]
patches = ["midi-sync"]

[case]
suites = []
volatile = true
no_sd = true
wall_timeout_s = 900

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "include"
path = "tests/emulator/fragments/l6max-first-boot-no-sd.toml"

[[step]]
action = "direct-usb-midi-round-trip"
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "include"
path = "patches/midi-sync/tests/emulator/fragments/request-state.toml"

# Mixer Control messages use USB MIDI cable 1. Verify the neighboring cables
# and an unused cable remain isolated from the firmware's channel-1 ring.
[[step]]
action = "direct-usb-midi-round-trip"
cable = 0
expect_ring_change = false
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "direct-usb-midi-round-trip"
cable = 2
expect_ring_change = false
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "direct-usb-midi-round-trip"
cable = 5
expect_ring_change = false
guest_timeout_ms = 15000
wall_timeout_s = 120
