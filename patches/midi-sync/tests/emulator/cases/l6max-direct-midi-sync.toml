version = 1
name = "l6max-direct-midi-sync"
models = ["l6max"]
card = "none"
backends = ["headless"]
patches = ["midi-sync"]
main_sha256 = "a224a9e1da62f2dac3b931aab17f0c9a6e76b2c3caeb1ab1b81ec90d44a308c5"
main_sha256_any = ["379804b806079242bc27b36b5b59c2fb354c1b99f0307803782cd43d1dc13d1f", "2518be3e15c31611c990a5ec6a6afde0aef158070038ed0b9d2bde34b5cef06d", "3d50d8070c5b87e44cfd3932b6f4069c0bf5bf9b053b1d2f5582f786d97b9126", "735b2058d0286e58cf14006c33bef28001a7b3526a53f3438fa0cf63b53e4efe", "9d56ac7d5308b34f1301640e9a2aee8ad9378cd1fa5cd0716b8c31e1c03221a2", "8e3c526dd7c47404ec181e6fecab4bbec64496957fb027ce5e90afa99ce884fb", "2b15804c9872d8f8d9c2b7bc024ea1dfbbbb474f3cf621942212f47c58981351"]

[case]
suites = ["full"]
volatile = true
no_sd = true
wall_timeout_s = 900

[[step]]
action = "delay"
guest_ms = 40000
guest_timeout_ms = 45000
wall_timeout_s = 900

# Confirm the startup prompts. A state spec boots without them.
[[step]]
setup_input = true
action = "press"
control = "recorder.confirm"

[[step]]
setup_input = true
action = "delay"
guest_ms = 1950

[[step]]
setup_input = true
action = "press"
control = "recorder.confirm"

[[step]]
setup_input = true
action = "delay"
guest_ms = 4950

[[step]]
action = "direct-usb-midi-round-trip"
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "host-midi-sync"
guest_timeout_ms = 30000
wall_timeout_s = 120

# Mixer Control messages use USB MIDI cable 1. Verify the neighboring cables
# and an unused cable remain isolated from the firmware's channel-1 ring.
[[step]]
action = "direct-usb-midi-round-trip"
cable = 0
expect_ring_change = false
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "direct-usb-midi-round-trip"
cable = 2
expect_ring_change = false
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "direct-usb-midi-round-trip"
cable = 5
expect_ring_change = false
guest_timeout_ms = 15000
wall_timeout_s = 120
