version = 1
name = "sd-l6max-midi-sync"
models = ["l6max"]
backends = ["headless"]
sd_patches = ["midi-sync"]

[case]
suites = ["sd-matrix"]
wall_timeout_s = 1200

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
models = ["l6max"]
action = "expect-display-image"
image = "tests/emulator/references/l6max-recorder-home.png"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "wait"
until = "sd-patch-loaded"

[[step]]
action = "press"
control = "rec-record"

[[step]]
action = "expect-card-entry"
path = "RECORDER"
wall_timeout_s = 60

[[step]]
action = "include"
path = "tests/emulator/fragments/sd-module-loaded.toml"

[[step]]
action = "expect-heap"
minimum_free = 131072

[[step]]
action = "include"
path = "tests/emulator/fragments/host-midi-native-round-trip.toml"

[[step]]
action = "include"
path = "patches/midi-sync/tests/emulator/fragments/request-state.toml"
