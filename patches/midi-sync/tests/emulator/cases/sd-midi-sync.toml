version = 1
name = "sd-midi-sync"
gdb = true
models = ["l6", "l6max"]
backends = ["headless"]
sd_patches = ["midi-sync"]

[case]
suites = ["sd-matrix"]
wall_timeout_s = 1200
environment = { L6_AUDIO_SAMPLE_TRACE = "1" }

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
models = ["l6max"]
action = "expect-display-image"
image = "tests/emulator/references/l6max-recorder-home.png"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "wait"
until = "sd-patch-loaded"

[[step]]
action = "press"
control = "rec-record"

[[step]]
action = "expect-card-entry"
path = "RECORDER"
wall_timeout_s = 60

[[step]]
action = "expect-sd-loader"

[[step]]
action = "capture-sd-module"
loaded = true

[[step]]
action = "expect-sd-allocation"
loaded = true

[[step]]
action = "expect-sd-chains"
loaded = true

[[step]]
action = "expect-sd-module"
loaded = true

[[step]]
action = "expect-heap"
minimum_free = 131072

[[step]]
models = ["l6"]
action = "include"
path = "patches/midi-sync/tests/emulator/fragments/l6-hook-probe.toml"
