# This disposable L6 guest remains stopped after the injected hook returns.
[[step]]
action = "l6-midi-probe-begin"
guest_timeout_ms = 15000
wall_timeout_s = 180

[[step]]
action = "l6-midi-probe-inject"
guest_timeout_ms = 15000
wall_timeout_s = 180

[[step]]
action = "l6-midi-probe-expect-hook"
guest_timeout_ms = 15000
wall_timeout_s = 180

[[step]]
action = "l6-midi-probe-expect-replies"
guest_timeout_ms = 15000
wall_timeout_s = 180
