version = 1
name = "sd-duplicate-bundle"
models = ["l6max"]
backends = ["headless"]
sd_patches = ["knob-dialog", "midi-sync"]
sd_bundle_mode = "duplicate-bundle"

# Two files of one module that carries two packages, as a PATCHES folder
# merged rather than replaced leaves. No choice between them is safe, so the
# loader loads neither.

[case]
suites = ["sd-matrix"]
wall_timeout_s = 1200

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "expect-display-image"
image = "tests/emulator/references/l6max-recorder-home.png"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "wait"
until = "sd-patch-empty"

[[step]]
action = "expect-sd-loader"

[[step]]
action = "capture-sd-module"
loaded = false

[[step]]
action = "expect-sd-module"
loaded = false
