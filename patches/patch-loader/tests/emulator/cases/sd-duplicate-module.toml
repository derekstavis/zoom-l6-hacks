version = 1
name = "sd-duplicate-module"
models = ["l6max"]
backends = ["headless"]
sd_patches = ["midi-sync"]
sd_bundle_mode = "duplicate-module"

# Two files of the same single-package module: the loader keeps one, so each
# hook site has one link, and MIDI sync still works.

[case]
suites = ["sd-matrix"]
wall_timeout_s = 1200

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "expect-display-image"
image = "tests/emulator/references/l6max-recorder-home.png"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "expect-sd-loader"

[[step]]
action = "capture-sd-module"
loaded = true

[[step]]
action = "expect-sd-allocation"
loaded = true

[[step]]
action = "expect-sd-chains"
loaded = true

[[step]]
action = "expect-sd-continuations"
loaded = true

[[step]]
action = "expect-sd-module"
loaded = true

[[step]]
action = "include"
path = "tests/emulator/fragments/host-midi-native-round-trip.toml"

