version = 1
name = "sd-hook-chain"
models = ["l6max"]
backends = ["headless"]
sd_patches = ["midi-sync"]
sd_bundle_mode = "ordered-chain"

[case]
suites = ["sd-matrix"]
wall_timeout_s = 1200

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "expect-display-image"
image = "tests/emulator/references/l6max-recorder-home.png"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "expect-sd-loader"

[[step]]
action = "capture-sd-module"
loaded = true

[[step]]
action = "expect-sd-module"
loaded = true
chain_count = 2

[[step]]
action = "include"
path = "tests/emulator/fragments/host-midi-native-round-trip.toml"

[[step]]
action = "include"
path = "patches/midi-sync/tests/emulator/fragments/request-state.toml"
