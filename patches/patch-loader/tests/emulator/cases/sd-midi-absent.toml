version = 1
name = "sd-midi-absent"
models = ["l6", "l6max"]
backends = ["headless"]
sd_patches = ["midi-sync"]
sd_bundle_mode = "absent"

[case]
suites = []
wall_timeout_s = 1200

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "wait"
until = "sd-patch-empty"

[[step]]
action = "expect-sd-loader"

[[step]]
action = "capture-sd-module"
loaded = false

[[step]]
action = "expect-sd-allocation"
loaded = false

[[step]]
action = "expect-sd-chains"
loaded = false

[[step]]
action = "expect-sd-continuations"
loaded = false

[[step]]
action = "expect-sd-module-images"
loaded = false
[[step]]
action = "expect-sd-latest-module"
loaded = false
