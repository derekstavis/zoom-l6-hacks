version = 1
name = "sd-midi-absent"
models = ["l6", "l6max"]
backends = ["headless"]
sd_patches = ["midi-sync"]
sd_bundle_mode = "absent"

[case]
suites = []
wall_timeout_s = 1200

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "wait"
until = "sd-patch-empty"

[[step]]
action = "expect-sd-patch"
loaded = false
