version = 1
name = "sd-midi-corrupt-sibling"
models = ["l6max"]
backends = ["headless"]
sd_patches = ["midi-sync"]
sd_bundle_mode = "corrupt-first"

[case]
suites = []
wall_timeout_s = 1200

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "expect-display-image"
image = "tests/emulator/references/l6max-recorder-home.png"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "press"
control = "rec-record"

[[step]]
action = "expect-card-entry"
path = "RECORDER"
wall_timeout_s = 60

[[step]]
action = "expect-sd-patch"
loaded = true

[[step]]
action = "expect-heap"
minimum_free = 131072

[[step]]
action = "host-midi-round-trip"
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "include"
path = "patches/midi-sync/tests/emulator/fragments/request-state.toml"
