version = 1
name = "sd-midi-volatile"
models = ["l6", "l6max"]
backends = ["headless"]
sd_patches = ["midi-sync"]

[case]
suites = []
wall_timeout_s = 1800

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "include"
path = "tests/emulator/fragments/sd-module-loaded.toml"

[[step]]
action = "sd-card"
inserted = false

[[step]]
models = ["l6"]
action = "wait-memory"
symbol = "sd_mount_status"
bytes = [1]

[[step]]
models = ["l6max"]
action = "expect-display-image"
image = "tests/emulator/references/l6max-storage-removed.png"

[[step]]
action = "include"
path = "tests/emulator/fragments/sd-module-loaded.toml"

[[step]]
action = "restart"

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

# The card remains ejected across restart; wait for the new firmware session
# before checking that the old module did not survive it.
[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "expect-sd-loader"

[[step]]
action = "capture-sd-module"
loaded = false

[[step]]
action = "expect-sd-allocation"
loaded = false

[[step]]
action = "expect-sd-chains"
loaded = false

[[step]]
action = "expect-sd-continuations"
loaded = false

[[step]]
action = "expect-sd-module"
loaded = false

[[step]]
action = "sd-card"
inserted = true

[[step]]
action = "press"
control = "rec-record"

[[step]]
action = "expect-sd-loader"
guest_timeout_ms = 30000
wall_timeout_s = 600

[[step]]
action = "capture-sd-module"
loaded = true
guest_timeout_ms = 30000
wall_timeout_s = 600

[[step]]
action = "expect-sd-allocation"
loaded = true
guest_timeout_ms = 30000
wall_timeout_s = 600

[[step]]
action = "expect-sd-chains"
loaded = true
guest_timeout_ms = 30000
wall_timeout_s = 600

[[step]]
action = "expect-sd-continuations"
loaded = true
guest_timeout_ms = 30000
wall_timeout_s = 600

[[step]]
action = "expect-sd-module"
loaded = true
guest_timeout_ms = 30000
wall_timeout_s = 600
