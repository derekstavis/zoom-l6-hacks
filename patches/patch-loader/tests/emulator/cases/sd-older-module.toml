version = 1
name = "sd-older-module"
models = ["l6max"]
backends = ["headless"]
sd_patches = ["midi-sync"]
sd_bundle_mode = "older-module"

# An older version of the module loads first; the loader keeps only the newer
# one, so each hook site has one link, and MIDI sync still works.

[case]
suites = ["sd-matrix"]
wall_timeout_s = 1200

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "expect-display-image"
image = "tests/emulator/references/l6max-recorder-home.png"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "expect-sd-loader"

[[step]]
action = "capture-sd-module"
loaded = true

[[step]]
action = "expect-sd-module"
loaded = true

[[step]]
action = "include"
path = "tests/emulator/fragments/host-midi-native-round-trip.toml"

