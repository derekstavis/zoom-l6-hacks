models = ["l6"]
action = "audio-callbacks-next"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
models = ["l6"]
action = "audio-callbacks-next"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
models = ["l6"]
action = "audio-callbacks-next"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
models = ["l6max"]
action = "audio-callbacks-next"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
models = ["l6max"]
action = "audio-callbacks-next"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
