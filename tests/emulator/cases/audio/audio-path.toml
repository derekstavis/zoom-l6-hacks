version = 1
name = "audio-path"
models = ["l6", "l6max"]
backends = ["headless"]

[case]
suites = ["devices", "regression", "full"]
volatile = true
no_sd = true
environment = { L6_AUDIO_TRACE = "1" }

[[step]]
action = "audio-callbacks-begin"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
models = ["l6"]
action = "audio-callbacks-next"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
models = ["l6"]
action = "audio-callbacks-next"
guest_timeout_ms = 60000
wall_timeout_s = 300

