version = 1
name = "editor-pad-assignments"
models = ["l6", "l6max"]
card = "pad-files"
backends = ["headless"]

[case]
suites = ["full"]
wall_timeout_s = 1200

[[step]]
action = "include"
path = "tests/emulator/fragments/editor-pad-setup-l6.toml"

[[step]]
action = "include"
path = "tests/emulator/fragments/editor-pad-setup-l6max.toml"

[[step]]
action = "include"
path = "tests/emulator/fragments/editor-pad-usb-ready.toml"

[[step]]
action = "editor-pad-assignments"
guest_timeout_ms = 60000
wall_timeout_s = 900
