version = 1
name = "l6-editor-pad-playback"
models = ["l6"]
card = "pad-files"
backends = ["headless"]

[case]
suites = ["full"]
wall_timeout_s = 1800
environment = { L6_AUDIO_SAMPLE_TRACE = "1" }

[[step]]
action = "include"
path = "tests/emulator/fragments/l6-first-boot-setup.toml"

[[step]]
action = "include"
path = "tests/emulator/fragments/editor-pad-usb-ready.toml"

[[step]]
action = "include"
path = "tests/emulator/fragments/editor-pad-assignments.toml"

# Exercise the Editor SysEx play command and the firmware's per-pad playing
# state, then require nonzero SAI1 TX samples for each assigned WAV.
[[step]]
action = "editor-playback-begin"
pad = 0
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "editor-playback-play"
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "editor-playback-wait"
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "editor-playback-observe"
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "editor-playback-sample"
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "editor-playback-assert"
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "editor-playback-end"
guest_timeout_ms = 15000
wall_timeout_s = 300

