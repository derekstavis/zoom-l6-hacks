version = 1
name = "l6-recorder-playback"
models = ["l6"]
gdb = true
card = "recorder-project"
backends = ["headless"]

[case]
suites = ["full"]
wall_timeout_s = 900
environment = { L6_AUDIO_SAMPLE_TRACE = "1" }

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 600000
wall_timeout_s = 1800

# The firmware selects the card's MASTER.WAV at boot; this holds its frame count.
# Checking it prevents a silent false pass.
[[step]]
action = "expect-memory"
symbol = "rec_selected_key"
bytes = [0, 166, 14, 0, 0, 0, 0, 0]

[[step]]
action = "l6-recorder-begin"
target = 4
guest_timeout_ms = 20000
wall_timeout_s = 600

[[step]]
action = "l6-recorder-press"
guest_timeout_ms = 20000
wall_timeout_s = 600

[[step]]
action = "l6-recorder-dispatcher"
guest_timeout_ms = 20000
wall_timeout_s = 600

[[step]]
action = "l6-recorder-assert-event"
guest_timeout_ms = 20000
wall_timeout_s = 600

[[step]]
action = "l6-recorder-handler"
guest_timeout_ms = 20000
wall_timeout_s = 600

[[step]]
action = "l6-recorder-assert-selection"
guest_timeout_ms = 20000
wall_timeout_s = 600

[[step]]
action = "l6-recorder-callback"
guest_timeout_ms = 20000
wall_timeout_s = 600

[[step]]
action = "l6-recorder-assert-callback"
guest_timeout_ms = 20000
wall_timeout_s = 600

[[step]]
action = "l6-recorder-observe"
guest_timeout_ms = 20000
wall_timeout_s = 600

[[step]]
action = "l6-recorder-release"
guest_timeout_ms = 20000
wall_timeout_s = 600

[[step]]
action = "l6-recorder-sample"
guest_timeout_ms = 20000
wall_timeout_s = 600

[[step]]
action = "l6-recorder-evidence"
guest_timeout_ms = 20000
wall_timeout_s = 600

[[step]]
action = "l6-recorder-assert-trace"
guest_timeout_ms = 20000
wall_timeout_s = 600

[[step]]
action = "l6-recorder-assert-dma"
guest_timeout_ms = 20000
wall_timeout_s = 600

[[step]]
action = "l6-recorder-end"
guest_timeout_ms = 20000
wall_timeout_s = 600
