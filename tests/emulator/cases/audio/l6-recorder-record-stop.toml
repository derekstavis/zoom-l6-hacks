version = 1
name = "l6-recorder-record-stop"
models = ["l6"]
backends = ["headless"]

[case]
suites = []
wall_timeout_s = 900

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 600000
wall_timeout_s = 1800

[[step]]
action = "expect-memory"
symbol = "rec_record_lamp"
bytes = [0, 0, 0, 0]

[[step]]
action = "press"
control = "rec-record"
guest_timeout_ms = 30000
wall_timeout_s = 60

[[step]]
action = "wait-memory"
symbol = "rec_record_lamp"
bytes = [16, 0, 0, 0]
guest_timeout_ms = 30000
wall_timeout_s = 60

[[step]]
action = "observe-duration"
activity = "recording"
guest_ms = 3000
guest_timeout_ms = 10000
wall_timeout_s = 30

[[step]]
action = "press"
control = "rec-record"
guest_timeout_ms = 30000
wall_timeout_s = 60

[[step]]
action = "wait-memory"
symbol = "rec_record_lamp"
bytes = [0, 0, 0, 0]
guest_timeout_ms = 30000
wall_timeout_s = 60
