version = 1
name = "l6-sound-pad-waveform"
models = ["l6"]
state = "volume-meter-ready"
audio_device = "driver=coreaudio,id=l6-audio,out.frequency=48000,out.channels=2,out.format=f32,out.buffer-count=12"
card = "sound-pads"
backends = ["headless"]

[case]
suites = []
wall_timeout_s = 900
environment = { L6_AUDIO_SAMPLE_TRACE = "1", L6_AUDIO_RAW_CAPTURE = "{logs}/sai-output.s32", L6_AUDIO_TDM_CAPTURE = "{logs}/sai-tdm.l6td" }

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "wait-l6-sound-pad-file"
path = "SOUND_PAD/PAD1/SWEEP.WAV"

# Press Pad 1's saved one-shot assignment. Its SAI output must match the source WAV.
[[step]]
action = "sound-pad-begin"
pad = 0
target = 49
assignment = "saved-state"
require_pad_led_change = false
expect_source = "SOUND_PAD/PAD1/SWEEP.WAV"
playback_window_ms = 10000
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "sound-pad-press"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "sound-pad-hold"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "sound-pad-release"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "sound-pad-observe"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "sound-pad-sample"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "sound-pad-assert-waveform"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "sound-pad-assert-audio"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "sound-pad-assert-led"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "sound-pad-assert-meter"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "sound-pad-finish"
guest_timeout_ms = 30000
wall_timeout_s = 300
