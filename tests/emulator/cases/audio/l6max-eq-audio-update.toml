version = 1
name = "l6max-eq-audio-update"
models = ["l6max"]
backends = ["headless"]

[case]
suites = ["regression", "full"]
volatile = true
no_sd = true

[[step]]
action = "include"
path = "tests/emulator/fragments/prepared-home.toml"

[[step]]
action = "select-mode"
mode = "eq-high"
guest_timeout_ms = 30000

# The mixer starts at neutral; the audio coefficient is the identity filter.
[[step]]
action = "expect-memory"
symbol = "mixer_first_channel_eq_high"
bytes = [64]

[[step]]
action = "expect-memory"
symbol = "dsp_eq_coefficients"
bytes = [0, 0, 128, 63]

[[step]]
action = "encoder"
channel = 1
steps = -20

# The firmware's audio task applies this coefficient from its deferred update
# ring, between audio blocks. These bytes are specific to 1.10.
[[step]]
action = "wait-memory"
symbol = "mixer_first_channel_eq_high"
bytes = [0]

[[step]]
action = "wait-memory"
symbol = "dsp_eq_coefficients"
bytes = [250, 40, 135, 62, 72, 212, 94, 189, 199, 88, 74, 63]
