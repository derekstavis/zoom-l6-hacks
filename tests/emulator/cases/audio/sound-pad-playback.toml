version = 1
name = "sound-pad-playback"
models = ["l6", "l6max"]
card = "assigned-pads"
backends = ["headless"]

[case]
suites = ["full"]
wall_timeout_s = 1800
environment = { L6_AUDIO_SAMPLE_TRACE = "1" }

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 120000
wall_timeout_s = 600

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 30000
wall_timeout_s = 180

# Exercise every mapped physical pad. Each action takes a fresh audio-trace
# baseline, so playback from the preceding pad cannot satisfy the next check.
[[step]]
action = "sound-pad-begin"
assignment = "saved-state"
pad = 0
target = 49
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "sound-pad-press"
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "sound-pad-hold"
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "sound-pad-release"
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "sound-pad-observe"
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "sound-pad-sample"
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "sound-pad-assert-waveform"
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "sound-pad-assert-audio"
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "sound-pad-assert-led"
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "sound-pad-assert-meter"
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "sound-pad-finish"
guest_timeout_ms = 15000
wall_timeout_s = 300

