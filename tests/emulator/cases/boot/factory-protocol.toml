[[step]]
action = "wait-memory"
symbol = "midi_sysex_session_state"
bytes = [0]

[[step]]
action = "wait-memory"
symbol = "factory_connected"
bytes = [0, 0, 0, 0]

[[step]]
action = "usb-sysex-begin"
guest_timeout_ms = 10000

[[step]]
action = "usb-sysex-exchange"
complete_on_match = true
bytes = [240, 126, 127, 6, 1, 247]
expect_prefix = [240, 126]

[[step]]
action = "usb-sysex-exchange"
complete_on_match = true
bytes = [240, 82, 0, 0, 103, 11, 247]
