version = 1
name = "factory-protocol"
models = ["l6max"]
state = "none"
card = "none"
backends = ["headless"]

[case]
suites = ["full"]
volatile = true
no_sd = true

[[step]]
action = "include"
path = "tests/emulator/fragments/l6max-first-boot-prompts.toml"

[[step]]
action = "expect-display-image"
image = "tests/smoke/images/l6max-factory-sd-prompt.png"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "restart"

[[step]]
action = "hold-chord"
controls = ["sound-pad-1", "sound-pad-2", "sound-pad-3"]
until = "factory-mode"

[[step]]
action = "expect-memory"
symbol = "system_mode"
bytes = [7, 0, 0, 0]

[[step]]
action = "include"
path = "tests/emulator/fragments/usb-enumerate.toml"

[[step]]
action = "usb-sysex-begin"
guest_timeout_ms = 30000
wall_timeout_s = 180

[[step]]
action = "usb-sysex-exchange"
complete_on_match = true
bytes = [240, 126, 127, 6, 1, 247]
expect_prefix = [240, 126]

[[step]]
action = "usb-sysex-exchange"
complete_on_match = true
bytes = [240, 82, 0, 0, 103, 11, 247]
expect_prefix = [240, 82, 0, 0, 103, 12]

[[step]]
action = "usb-sysex-exchange"
complete_on_match = true
bytes = [240, 82, 0, 0, 103, 15, 0, 0, 247]
expect_prefix = [240, 82, 0, 0, 103, 15, 1, 0, 1]

[[step]]
action = "usb-sysex-exchange"
complete_on_match = true
bytes = [240, 82, 0, 0, 103, 15, 0, 1, 247]
expect_prefix = [240, 82, 0, 0, 103, 15, 1, 1, 1]

[[step]]
action = "usb-sysex-exchange"
complete_on_match = true
bytes = [240, 82, 0, 0, 103, 15, 0, 2, 247]
expect_prefix = [240, 82, 0, 0, 103, 15, 1, 2, 1]

[[step]]
