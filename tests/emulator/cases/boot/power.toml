version = 1
name = "power"
models = ["l6", "l6max"]
backends = ["headless"]

[case]
suites = ["lifecycle", "full"]

[[step]]
action = "include"
path = "tests/emulator/fragments/prepared-home.toml"

[[step]]
models = ["l6max"]
action = "power-begin"
hold_ms = 100
powered = true
guest_timeout_ms = 5000
wall_timeout_s = 60

[[step]]
models = ["l6max"]
action = "power-wait-ack"
guest_timeout_ms = 5000
wall_timeout_s = 60

[[step]]
models = ["l6max"]
action = "power-observe-on"
guest_ms = 1100
guest_timeout_ms = 5000
wall_timeout_s = 60

[[step]]
models = ["l6max"]
action = "power-end"
guest_timeout_ms = 5000
wall_timeout_s = 60

[[step]]
models = ["l6"]
action = "power-begin"
hold_ms = 1000
powered = false
guest_timeout_ms = 120000
wall_timeout_s = 60

[[step]]
models = ["l6"]
action = "power-wait-ack"
guest_timeout_ms = 120000
wall_timeout_s = 60

[[step]]
models = ["l6"]
action = "power-wait-off"
min_cutoff_ms = 300
max_cutoff_ms = 800
guest_timeout_ms = 120000
wall_timeout_s = 60

[[step]]
models = ["l6"]
action = "power-observe-stopped"
settle_wall_ms = 100
observe_wall_ms = 200
guest_timeout_ms = 120000
wall_timeout_s = 60

[[step]]
models = ["l6"]
action = "power-end"
guest_timeout_ms = 120000
wall_timeout_s = 60

[[step]]
models = ["l6max"]
action = "power-begin"
hold_ms = 3500
powered = false
guest_timeout_ms = 120000
wall_timeout_s = 60

[[step]]
models = ["l6max"]
action = "power-wait-ack"
guest_timeout_ms = 120000
wall_timeout_s = 60

[[step]]
models = ["l6max"]
action = "power-wait-off"
guest_timeout_ms = 120000
wall_timeout_s = 60

[[step]]
models = ["l6max"]
action = "power-observe-stopped"
settle_wall_ms = 100
observe_wall_ms = 200
guest_timeout_ms = 120000
wall_timeout_s = 60

[[step]]
models = ["l6max"]
action = "power-end"
guest_timeout_ms = 120000
wall_timeout_s = 60

[[step]]
action = "restart"

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 120000
wall_timeout_s = 600

[[step]]
models = ["l6max"]
action = "expect-recorder"
