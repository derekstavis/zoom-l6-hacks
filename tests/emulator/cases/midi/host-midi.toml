version = 1
name = "host-midi"
models = ["l6", "l6max"]
backends = ["headless"]

[case]
suites = ["full"]
no_sd = true
wall_timeout_s = 900

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "include"
path = "tests/emulator/fragments/l6-first-boot-setup.toml"

[[step]]
action = "include"
path = "tests/emulator/fragments/l6max-first-boot-no-sd.toml"

[[step]]
action = "include"
path = "tests/emulator/fragments/host-midi-native-round-trip.toml"
