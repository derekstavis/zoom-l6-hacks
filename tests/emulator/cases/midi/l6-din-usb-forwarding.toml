version = 1
name = "l6-din-usb-forwarding"
models = ["l6"]
state = "none"
backends = ["headless"]

[case]
suites = ["full"]
volatile = true
no_sd = true
wall_timeout_s = 1800

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 120000
wall_timeout_s = 600

[[step]]
action = "include"
path = "tests/emulator/fragments/l6-first-boot-setup.toml"

[[step]]
action = "l6-din-usb-forwarding"
guest_timeout_ms = 2000
wall_timeout_s = 180
