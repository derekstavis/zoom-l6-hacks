version = 1
name = "l6max-channel-signal-pwm"
models = ["l6max"]
card = "none"
gdb = true
backends = ["headless"]

[case]
suites = ["full", "panel"]
volatile = true
no_sd = true
wall_timeout_s = 900

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 900

[[step]]
action = "l6max-channel-signal-pwm"
guest_timeout_ms = 60000
wall_timeout_s = 120
