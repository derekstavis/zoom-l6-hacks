version = 1
name = "l6max-input-smoke"
models = ["l6max"]
backends = ["headless"]

[case]
suites = ["regression", "full"]
volatile = true
no_sd = true
wall_timeout_s = 1800

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 600000
wall_timeout_s = 1800

[[step]]
action = "l6max-input-timing"
guest_timeout_ms = 60000
wall_timeout_s = 120

[[step]]
action = "l6max-panel-key-begin"
wall_timeout_s = 120

[[step]]
action = "l6max-panel-key-check"
code = 25
bit = 1
word_index = 4
active = false
wait = false

[[step]]
action = "l6max-panel-key-input"
target = 15
pressed = true

[[step]]
action = "l6max-panel-key-check"
code = 25
bit = 1
word_index = 4
active = true
wait = true

