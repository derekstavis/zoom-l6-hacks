[[step]]
action = "l6max-panel-key-input"
target = 25
pressed = false

[[step]]
action = "l6max-panel-key-check"
code = 27
bit = 3
word_index = 4
active = false
wait = true

[[step]]
action = "l6max-panel-key-check"
code = 28
bit = 4
word_index = 4
active = false
wait = false

[[step]]
action = "l6max-panel-key-input"
target = 30
pressed = true

[[step]]
action = "l6max-panel-key-check"
code = 28
bit = 4
word_index = 4
active = true
wait = true

[[step]]
action = "l6max-panel-key-input"
