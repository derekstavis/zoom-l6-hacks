version = 1
name = "l6max-input-smoke"
models = ["l6max"]
backends = ["headless"]

[case]
suites = ["regression", "full"]
volatile = true
no_sd = true
wall_timeout_s = 1800

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 600000
wall_timeout_s = 1800

[[step]]
action = "l6max-timing-begin"
guest_timeout_ms = 60000
wall_timeout_s = 120

[[step]]
action = "l6max-timing-settle"
wall_ms = 100
guest_timeout_ms = 60000
wall_timeout_s = 120

[[step]]
action = "l6max-timing-baseline"
guest_timeout_ms = 60000
wall_timeout_s = 120

[[step]]
action = "l6max-timing-enqueue"
target = 1
hold_ms = 50
pairs = 2
guest_timeout_ms = 60000
wall_timeout_s = 120

[[step]]
action = "l6max-timing-wait-first"
guest_timeout_ms = 60000
wall_timeout_s = 120

[[step]]
action = "l6max-timing-observe-paused"
wall_ms = 700
guest_timeout_ms = 60000
wall_timeout_s = 120

[[step]]
action = "l6max-timing-assert-paused"
guest_timeout_ms = 60000
wall_timeout_s = 120

[[step]]
action = "l6max-timing-resume"
guest_timeout_ms = 60000
wall_timeout_s = 120

[[step]]
action = "l6max-timing-wait-queued"
guest_timeout_ms = 60000
wall_timeout_s = 120

[[step]]
action = "l6max-timing-wait-reports"
guest_timeout_ms = 60000
wall_timeout_s = 120

[[step]]
action = "l6max-timing-assert-reports"
guest_timeout_ms = 60000
wall_timeout_s = 120

[[step]]
action = "l6max-timing-observe-display"
guest_ms = 1500
guest_timeout_ms = 60000
wall_timeout_s = 120

[[step]]
action = "l6max-timing-assert-display"
guest_timeout_ms = 60000
wall_timeout_s = 120

[[step]]
action = "l6max-timing-encoder"
index = 2
steps = 1
guest_timeout_ms = 60000
wall_timeout_s = 120

[[step]]
action = "l6max-timing-wait-encoder"
guest_timeout_ms = 60000
wall_timeout_s = 120

[[step]]
action = "l6max-timing-wait-encoder-report"
guest_timeout_ms = 60000
wall_timeout_s = 120

[[step]]
action = "l6max-timing-assert-encoder"
guest_timeout_ms = 60000
wall_timeout_s = 120

[[step]]
action = "l6max-timing-end"
guest_timeout_ms = 60000
wall_timeout_s = 120

[[step]]
action = "l6max-panel-key-begin"
wall_timeout_s = 120

[[step]]
action = "l6max-panel-key-check"
code = 25
bit = 1
word_index = 4
active = false
wait = false

[[step]]
action = "l6max-panel-key-input"
target = 15
pressed = true

[[step]]
action = "l6max-panel-key-check"
code = 25
bit = 1
word_index = 4
active = true
wait = true

[[step]]
action = "l6max-panel-key-input"
target = 15
pressed = false

[[step]]
action = "l6max-panel-key-check"
code = 25
bit = 1
word_index = 4
active = false
wait = true

[[step]]
