version = 1
name = "panel"
models = ["l6", "l6max"]
state = "setup-complete"
card = "empty"

[case]
suites = ["regression", "full", "panel"]
wall_timeout_s = 2400

[[step]]
action = "include"
path = "tests/emulator/fragments/prepared-level.toml"

[[step]]
action = "include"
path = "tests/emulator/fragments/controls.toml"

[[step]]
action = "include"
path = "tests/emulator/fragments/indicators.toml"

[[step]]
action = "include"
path = "tests/emulator/fragments/buttons.toml"

[[step]]
models = ["l6max"]
action = "include"
path = "tests/emulator/fragments/button-reports.toml"

[[step]]
models = ["l6"]
action = "include"
path = "tests/emulator/fragments/l6-gui-controls.toml"

# A brief press: the GUI's default POWER click holds long enough to power off.
[[step]]
models = ["l6max"]
action = "hold"
control = "power"
duration_ms = 100

[[step]]
models = ["l6max"]
action = "expect-trace-count"
pattern = "l6 main power input=1"
count = 1

[[step]]
models = ["l6max"]
action = "expect-trace-count"
pattern = "l6 main power input=0"
count = 2
at_least = true

[[step]]
action = "include"
path = "tests/emulator/fragments/analog-controls.toml"
