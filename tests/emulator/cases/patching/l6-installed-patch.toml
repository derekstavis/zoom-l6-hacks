version = 1
name = "l6-installed-patch"
models = ["l6"]
card = "none"
backends = ["headless"]
installed_patches = ["midi-sync"]

[case]
suites = ["full"]
no_sd = true
wall_timeout_s = 900

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "include"
path = "tests/emulator/fragments/l6-first-boot-setup.toml"

[[step]]
action = "direct-usb-midi-round-trip"
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "include"
path = "patches/midi-sync/tests/emulator/fragments/request-state.toml"

[[step]]
action = "include"
path = "patches/midi-sync/tests/emulator/fragments/l6-indicators.toml"
