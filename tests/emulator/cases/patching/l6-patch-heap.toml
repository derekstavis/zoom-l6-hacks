version = 1
name = "l6-patch-heap"
models = ["l6"]
backends = ["headless"]
patches = ["midi-sync"]

# The L6 patch through encoder turns, a recorded take and its playback. The
# heap's lowest point must leave 128 KiB free.

[case]
suites = ["full"]
wall_timeout_s = 900

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 600000
wall_timeout_s = 1800

[[step]]
action = "encoder"
channel = 1
steps = 4

[[step]]
action = "expect-encoder-reports"

[[step]]
action = "encoder"
channel = 6
steps = -4

[[step]]
action = "expect-encoder-reports"

# Record starts and stops a take.
[[step]]
action = "press"
control = "rec-record"
guest_timeout_ms = 30000
wall_timeout_s = 60

[[step]]
action = "expect-card-entry"
path = "RECORDER"
wall_timeout_s = 60

[[step]]
action = "observe-duration"
activity = "recording"
guest_ms = 10000
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "press"
control = "rec-record"
guest_timeout_ms = 30000
wall_timeout_s = 60

[[step]]
action = "wait-recorded-files"
files = ["TRACK01.WAV", "TRACK02.WAV", "TRACK03_ST.WAV", "TRACK04_ST.WAV", "TRACK05_ST.WAV", "TRACK06_ST.WAV"]

[[step]]
action = "press"
control = "play"

[[step]]
action = "observe-duration"
activity = "playback"
guest_ms = 5000
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "wait-memory"
symbol = "rec_playstop_lamp"
bytes = [16, 0]

[[step]]
action = "press"
control = "play"

[[step]]
action = "wait-memory"
symbol = "rec_playstop_lamp"
bytes = [0, 0]

[[step]]
action = "expect-heap"
minimum_free = 131072
