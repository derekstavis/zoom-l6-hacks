version = 1
name = "l6max-patch-heap"
models = ["l6max"]
backends = ["headless"]
patches = ["knob-dialog", "midi-sync", "din-mixer-control"]

# The three patches listed above, through knob popups, a recorded take and
# its playback. The heap's lowest point must leave 128 KiB free.

[case]
suites = ["full"]
wall_timeout_s = 900

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "expect-display-image"
image = "tests/emulator/references/l6max-recorder-home.png"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "checkpoint"
name = "recorder-home"

[[step]]
action = "encoder"
channel = 1
steps = 4

[[step]]
action = "expect-display"
checkpoint = "recorder-home"
changed = true
guest_timeout_ms = 5000
wall_timeout_s = 60

[[step]]
action = "encoder"
channel = 8
steps = -4

[[step]]
action = "expect-display-image"
image = "tests/emulator/references/l6max-recorder-home.png"
guest_timeout_ms = 10000
wall_timeout_s = 120

[[step]]
action = "press"
control = "rec-record"

[[step]]
action = "expect-card-entry"
path = "RECORDER"
wall_timeout_s = 60

[[step]]
action = "observe-duration"
activity = "recording"
guest_ms = 10000
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "press"
control = "rec-play-stop"

[[step]]
action = "wait-recorded-files"
files = ["TRACK01_01.wav", "TRACK02_01.wav", "TRACK03_01.wav", "TRACK04_01.wav", "TRACK05_ST_01.wav", "TRACK06_ST_01.wav", "TRACK07_ST_01.wav", "TRACK08_ST_01.wav", "MASTER_01.wav"]

[[step]]
action = "press"
control = "rec-play-stop"

[[step]]
action = "observe-duration"
activity = "playback"
guest_ms = 5000
guest_timeout_ms = 15000
wall_timeout_s = 300

[[step]]
action = "wait-memory"
symbol = "rec_mode"
bytes = [2]

[[step]]
action = "press"
control = "rec-play-stop"

[[step]]
action = "wait-memory"
symbol = "rec_mode"
bytes = [0]

[[step]]
action = "expect-heap"
minimum_free = 131072
