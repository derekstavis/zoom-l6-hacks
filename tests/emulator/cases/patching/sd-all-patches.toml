version = 1
name = "sd-all-patches"
models = ["l6max"]
backends = ["headless"]
gdb = true
patches = ["din-mixer-control"]
sd_patches = ["knob-dialog", "midi-sync"]

[case]
suites = ["sd-matrix"]
wall_timeout_s = 2400

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "expect-display-image"
image = "tests/emulator/references/l6max-recorder-home.png"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "expect-sd-patch"
loaded = true

[[step]]
action = "press"
control = "rec-record"

[[step]]
action = "expect-card-entry"
path = "RECORDER"

[[step]]
action = "expect-sd-patch"
loaded = true

[[step]]
action = "include"
path = "tests/emulator/fragments/l6max-din-mixer-setup.toml"

[[step]]
action = "l6max-din-mixer-control"
expect_din_ring_change = true
guest_timeout_ms = 10000
wall_timeout_s = 120

[[step]]
action = "restart"

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "expect-sd-patch"
loaded = true

[[step]]
action = "knob-dialog-ready"
guest_timeout_ms = 180000
wall_timeout_s = 600

[[step]]
action = "knob-dialog-guard"
guest_timeout_ms = 180000
wall_timeout_s = 600

[[step]]
action = "knob-dialog-baseline"
guest_timeout_ms = 180000
wall_timeout_s = 600

[[step]]
action = "knob-dialog-preflight-begin"
guest_timeout_ms = 180000
wall_timeout_s = 600

[[step]]
action = "knob-dialog-preflight-descriptor"
guest_timeout_ms = 180000
wall_timeout_s = 600

[[step]]
action = "knob-dialog-preflight-text-alias"
guest_timeout_ms = 180000
wall_timeout_s = 600

[[step]]
action = "knob-dialog-preflight-layer-collision"
guest_timeout_ms = 180000
wall_timeout_s = 600

[[step]]
action = "knob-dialog-preflight-widget-layer"
guest_timeout_ms = 180000
wall_timeout_s = 600

[[step]]
action = "knob-dialog-preflight-background-layer"
guest_timeout_ms = 180000
wall_timeout_s = 600

[[step]]
action = "knob-dialog-callback-race"
guest_timeout_ms = 180000
wall_timeout_s = 600

[[step]]
action = "knob-dialog-first-activation"
guest_timeout_ms = 180000
wall_timeout_s = 600

[[step]]
action = "knob-dialog-active-overlay"
guest_timeout_ms = 180000
wall_timeout_s = 600

[[step]]
action = "knob-dialog"
guest_timeout_ms = 180000
wall_timeout_s = 600

[[step]]
action = "expect-sd-patch"
loaded = true

[[step]]
action = "expect-heap"
minimum_free = 131072
