version = 1
name = "sd-all-patches"
models = ["l6max"]
backends = ["headless"]
gdb = true
patches = ["din-mixer-control"]
sd_patches = ["knob-dialog", "midi-sync"]

[case]
suites = ["sd-matrix"]
wall_timeout_s = 2400

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "expect-display-image"
image = "tests/emulator/references/l6max-recorder-home.png"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "expect-sd-loader"

[[step]]
action = "expect-sd-module"
loaded = true

[[step]]
action = "press"
control = "rec-record"

[[step]]
action = "expect-card-entry"
path = "RECORDER"

[[step]]
action = "expect-sd-loader"

[[step]]
action = "expect-sd-module"
loaded = true

[[step]]
action = "include"
path = "tests/emulator/fragments/l6max-din-mixer-setup.toml"

[[step]]
action = "include"
path = "patches/din-mixer-control/tests/emulator/fragments/check.toml"

[[step]]
action = "restart"

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "expect-sd-loader"

[[step]]
action = "expect-sd-module"
loaded = true

[[step]]
action = "knob-dialog-ready"
guest_timeout_ms = 180000
wall_timeout_s = 600

[[step]]
action = "knob-dialog-guard"
guest_timeout_ms = 180000
wall_timeout_s = 600

