version = 1
name = "sd-knob-midi-sync-dynamic"
models = ["l6max"]
backends = ["headless"]
sd_patches = ["knob-dialog", "midi-sync"]

[case]
suites = ["sd-matrix"]
wall_timeout_s = 1200

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "delay"
guest_ms = 8000
guest_timeout_ms = 20000
wall_timeout_s = 300

[[step]]
action = "expect-sd-patch"
loaded = true
