version = 1
name = "sd-knob-midi"
models = ["l6max"]
backends = ["headless"]
patches = ["knob-dialog"]
sd_patches = ["midi-sync"]
gdb = true

[case]
suites = ["sd-matrix"]
wall_timeout_s = 1800

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "expect-sd-loader"

[[step]]
action = "expect-sd-module"
loaded = true

[[step]]
action = "knob-dialog-ready"
guest_timeout_ms = 180000
wall_timeout_s = 600

