version = 1
name = "sd-static-all"
models = ["l6max"]
backends = ["headless"]
gdb = true
patches = ["din-mixer-control", "knob-dialog"]
sd_patches = []

[case]
suites = ["sd-matrix"]
wall_timeout_s = 1800

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "expect-display-image"
image = "tests/emulator/references/l6max-recorder-home.png"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "wait"
until = "sd-patch-empty"

[[step]]
action = "expect-sd-loader"

[[step]]
action = "expect-sd-module"
loaded = false

[[step]]
action = "include"
path = "tests/emulator/fragments/l6max-din-mixer-setup.toml"

[[step]]
action = "include"
path = "patches/din-mixer-control/tests/emulator/fragments/check.toml"

[[step]]
action = "restart"

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "knob-dialog-ready"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog-guard"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog-baseline"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog-preflight-begin"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog-preflight-descriptor"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog-preflight-text-alias"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog-preflight-layer-collision"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog-preflight-widget-layer"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog-preflight-background-layer"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog-callback-race"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog-first-activation"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog-active-display"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog-level-demo"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "knob-dialog-task-contexts"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "include"
path = "patches/knob-dialog/tests/emulator/fragments/overlay-invariants.toml"

[[step]]
action = "knob-dialog-bitmap-zero"
guest_timeout_ms = 180000
wall_timeout_s = 600

[[step]]
action = "include"
path = "patches/knob-dialog/tests/emulator/fragments/refreshed-overlay.toml"
[[step]]
action = "knob-dialog-locked-update"
guest_timeout_ms = 180000
wall_timeout_s = 600
[[step]]
action = "include"
