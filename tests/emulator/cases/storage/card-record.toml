version = 1
name = "card-record"
models = ["l6", "l6max"]
backends = ["headless"]

# A generated card must be one the firmware accepts for recording: it rejects
# others only at this point, after booting and playing pads normally.

[case]
suites = ["devices", "full"]
wall_timeout_s = 900

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
models = ["l6max"]
action = "expect-display-image"
image = "tests/emulator/references/l6max-recorder-home.png"
guest_timeout_ms = 30000
wall_timeout_s = 300

[[step]]
action = "press"
control = "rec-record"

[[step]]
action = "expect-card-entry"
path = "RECORDER"
wall_timeout_s = 60
