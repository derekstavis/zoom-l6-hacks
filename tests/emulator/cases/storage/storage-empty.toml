version = 1
name = "storage-empty"
models = ["l6", "l6max"]
backends = ["headless"]
trace_sd = true

[case]
suites = ["devices", "full"]
no_sd = true

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 120000
wall_timeout_s = 600

[[step]]
action = "expect-trace"
contains = []
absent = ["sdhci_send_command"]
