version = 1
name = "storage"
models = ["l6", "l6max"]
backends = ["headless"]

[case]
suites = ["devices", "full"]

[[step]]
action = "include"
path = "tests/emulator/fragments/prepared-home.toml"

[[step]]
models = ["l6max"]
action = "expect-display-image"
image = "tests/emulator/references/l6max-recorder-home.png"

[[step]]
action = "checkpoint"
name = "home"

[[step]]
action = "sd-card"
inserted = false

[[step]]
models = ["l6"]
action = "wait-memory"
symbol = "sd_mount_status"
bytes = [1]

[[step]]
models = ["l6max"]
action = "expect-display"
checkpoint = "home"
changed = true
guest_timeout_ms = 20000
wall_timeout_s = 480

[[step]]
models = ["l6max"]
action = "expect-display-image"
image = "tests/emulator/references/l6max-storage-removed.png"
guest_timeout_ms = 20000
wall_timeout_s = 480

[[step]]
models = ["l6max"]
action = "checkpoint"
name = "storage-removed"

[[step]]
action = "sd-card"
inserted = true

[[step]]
models = ["l6"]
action = "wait-memory"
symbol = "sd_mount_status"
bytes = [2]

[[step]]
models = ["l6max"]
action = "expect-display"
checkpoint = "storage-removed"
changed = true
guest_timeout_ms = 15000
wall_timeout_s = 360

[[step]]
models = ["l6max"]
action = "expect-display-image"
image = "tests/emulator/references/l6max-recorder-home.png"
guest_timeout_ms = 15000
wall_timeout_s = 360

[[step]]
action = "expect-trace"
contains = ["CMD00", "CMD08", "CMD02", "CMD03", "CMD09", "CMD07", "CMD17", "l6 SD card detect=0", "l6 SD card detect=1"]
