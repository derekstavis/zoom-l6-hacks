version = 1
name = "usb-storage"
models = ["l6max"]
backends = ["headless"]

[case]
suites = ["devices", "full"]

[[step]]
action = "include"
path = "tests/emulator/fragments/prepared-home.toml"

[[step]]
action = "expect-display-image"
image = "tests/emulator/references/l6max-recorder-home.png"

[[step]]
action = "press"
control = "recorder.menu"

[[step]]
action = "expect-display-image"
image = "tests/smoke/images/l6max-sound-assign/menu-project.png"

[[step]]
action = "press"
control = "recorder.down"

[[step]]
action = "press"
control = "recorder.down"

[[step]]
action = "press"
control = "recorder.down"

[[step]]
action = "press"
control = "recorder.down"

[[step]]
action = "press"
control = "recorder.down"

[[step]]
action = "expect-display-image"
image = "tests/smoke/images/l6max-usb-menu-selection.png"

[[step]]
action = "checkpoint"
name = "usb-menu-selection"

[[step]]
action = "press"
control = "recorder.confirm"

[[step]]
action = "expect-display-image"
image = "tests/smoke/images/l6max-usb-transfer-ready.png"

[[step]]
action = "usb-storage-begin"
guest_timeout_ms = 30000
wall_timeout_s = 180

[[step]]
action = "usb-storage-inquiry"
guest_timeout_ms = 30000
wall_timeout_s = 180

[[step]]
action = "usb-storage-ready"
guest_timeout_ms = 30000
wall_timeout_s = 180

[[step]]
action = "usb-storage-capacity"
guest_timeout_ms = 30000
wall_timeout_s = 180

[[step]]
action = "usb-storage-read-boot"
guest_timeout_ms = 30000
wall_timeout_s = 180

[[step]]
action = "usb-storage-assert-boot"
guest_timeout_ms = 30000
wall_timeout_s = 180

[[step]]
action = "usb-storage-last-read"
guest_timeout_ms = 30000
wall_timeout_s = 180

[[step]]
action = "usb-storage-last-write"
guest_timeout_ms = 30000
wall_timeout_s = 180

[[step]]
action = "usb-storage-last-assert"
guest_timeout_ms = 30000
wall_timeout_s = 180

[[step]]
action = "usb-storage-fat-open"
guest_timeout_ms = 30000
wall_timeout_s = 180

[[step]]
action = "usb-storage-create"
length = 1537
multiplier = 37
increment = 11
guest_timeout_ms = 30000
wall_timeout_s = 180

[[step]]
action = "usb-storage-flush-created"
guest_timeout_ms = 30000
wall_timeout_s = 180

[[step]]
action = "usb-storage-read-file"
guest_timeout_ms = 30000
wall_timeout_s = 180

[[step]]
action = "usb-storage-remove-file"
guest_timeout_ms = 30000
wall_timeout_s = 180

[[step]]
action = "usb-storage-assert-file"
guest_timeout_ms = 30000
wall_timeout_s = 180

[[step]]
action = "usb-storage-flush-removed"
guest_timeout_ms = 30000
wall_timeout_s = 180

[[step]]
action = "usb-storage-end"
guest_timeout_ms = 30000
wall_timeout_s = 180
