version = 1
name = "usb"
models = ["l6", "l6max"]
state = "none"
backends = ["headless"]

[case]
suites = ["devices", "full"]
volatile = true
no_sd = true

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 120000
wall_timeout_s = 600

[[step]]
action = "include"
path = "tests/emulator/fragments/l6-first-boot-setup.toml"

[[step]]
action = "include"
path = "tests/emulator/fragments/l6max-first-boot-no-sd.toml"

# Waits for firmware to start its USB controller after boot.
[[step]]
action = "usb-descriptors"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "usb-midi-open"

[[step]]
action = "encoder"
channel = 1
steps = 4

[[step]]
action = "expect-encoder-reports"

[[step]]
action = "usb-midi-begin"

[[step]]
action = "usb-midi-expect-encoder"

[[step]]
action = "usb-midi-prepare-level"
value = 32

[[step]]
action = "usb-midi-set-alternate"

[[step]]
action = "usb-midi-set-target"

[[step]]
action = "usb-midi-end"
