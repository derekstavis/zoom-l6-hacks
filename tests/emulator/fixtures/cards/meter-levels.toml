# One channel at a time at rising levels, held long enough for the 33 ms meter
# scan. Each model plays a different pad at a level its firmware gain suits.
version = 1

[l6]
# One channel at a time at rising levels, held long enough for the 33 ms meter scan.

[[l6.file]]
path = "SOUND_PAD/PAD1/TONE220.WAV"
levels = { hz = 220.0, steps = [
  { seconds = 0.9, left = 0.0, right = 0.0 },
  { seconds = 0.3, left = 0.01, right = 0.0 },
  { seconds = 0.3, left = 0.03, right = 0.0 },
  { seconds = 0.3, left = 0.1, right = 0.0 },
  { seconds = 0.9, left = 0.0, right = 0.0 },
  { seconds = 0.3, left = 0.0, right = 0.01 },
  { seconds = 0.3, left = 0.0, right = 0.03 },
  { seconds = 0.3, left = 0.0, right = 0.1 },
] }

[[l6.sound_pad]]
pad = 1
file = "SOUND_PAD/PAD1/TONE220.WAV"
mode = "one-shot"
level = 49

[l6max]
# One channel at a time at each level, held long enough for the 33 ms meter scan.

[[l6max.file]]
path = "SOUND_PAD/PAD4/TONE660.WAV"
levels = { hz = 660.0, steps = [
  { seconds = 0.8, left = 0.0, right = 0.0 },
  { seconds = 2.4, left = 0.1, right = 0.0 },
  { seconds = 0.8, left = 0.0, right = 0.0 },
  { seconds = 2.4, left = 0.0, right = 0.1 },
  { seconds = 0.8, left = 0.0, right = 0.0 },
  { seconds = 2.4, left = 0.5, right = 0.0 },
  { seconds = 0.8, left = 0.0, right = 0.0 },
  { seconds = 2.4, left = 0.0, right = 0.5 },
  { seconds = 0.8, left = 0.0, right = 0.0 },
  { seconds = 2.4, left = 0.1, right = 0.0 },
  { seconds = 0.8, left = 0.0, right = 0.0 },
] }

[[l6max.sound_pad]]
pad = 4
file = "SOUND_PAD/PAD4/TONE660.WAV"
mode = "one-shot"
level = 30
