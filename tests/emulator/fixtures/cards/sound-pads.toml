# Sound-pad audio for the waveform and playback cases, on each model's pad at a
# level below where its firmware gain clips the sweep.
version = 1

[l6]
# Sound-pad audio for the waveform and playback cases. Below full scale so firmware
# gain does not clip it.

[[l6.file]]
path = "SOUND_PAD/PAD1/SWEEP.WAV"
sweep = { low_hz = 100.0, high_hz = 8000.0, seconds = 6.0, amplitude = 0.7 }

[[l6.sound_pad]]
pad = 1
file = "SOUND_PAD/PAD1/SWEEP.WAV"
mode = "one-shot"
level = 49

[l6max]
# Sound-pad audio for the waveform and playback cases. Higher levels make firmware
# gain clip this sweep.

[[l6max.file]]
path = "SOUND_PAD/PAD4/SWEEP.WAV"
sweep = { low_hz = 100.0, high_hz = 8000.0, seconds = 6.0, amplitude = 0.7 }

[[l6max.sound_pad]]
pad = 4
file = "SOUND_PAD/PAD4/SWEEP.WAV"
mode = "one-shot"
level = 30
