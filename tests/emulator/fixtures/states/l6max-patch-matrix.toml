# L6max state for the generated `patches` suite: setup complete, Mixer Control
# via MIDI on (din-mixer-control acts only then), and the stock Room effect
# selected with channel 1 sent to it, so an effect replacement has input.
version = 1
model = "l6max"

[settings]
base = "defaults"

[settings.values]
mixer_control_via_midi = 1
"mixer.current.efx_type" = 1
"mixer.current.channel[0].efx[0]" = 64
"mixer.current.level[0]" = 30
setup_required = 0
last_date_year = 2026
last_date_month = 2
last_date_day = 2
last_date_hour = 1
last_date_minute = 1

[rtc]
datetime = "2026-02-02T01:01:00"

[panel]
programmed = true
