[[step]]
action = "direct-midi-connect"
cable = 1
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "include"
path = "tests/emulator/fragments/host-midi-round-trip-input.toml"
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "checkpoint"
name = "before-midi-cc-1"
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "include"
path = "tests/emulator/fragments/host-midi-round-trip-send.toml"
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "expect-ring-changed"
channel = 1
checkpoint = "before-midi-cc-1"
midi_transaction = true
observe_wall_ms = 3000
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "host-midi-end"
guest_timeout_ms = 15000
wall_timeout_s = 120
