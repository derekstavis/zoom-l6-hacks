[[step]]
action = "direct-midi-connect"
cable = 5
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "include"
path = "tests/emulator/fragments/host-midi-round-trip-input.toml"
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "checkpoint"
name = "before-midi-cc-5"
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
models = ["l6"]
action = "host-midi-send-cc"
channel = 0
controller = 83
value = 100
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
models = ["l6max"]
action = "host-midi-send-cc"
channel = 0
controller = 81
value = 100
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "expect-ring-unchanged"
channel = 1
checkpoint = "before-midi-cc-5"
observe_wall_ms = 3000
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "host-midi-end"
guest_timeout_ms = 15000
wall_timeout_s = 120
