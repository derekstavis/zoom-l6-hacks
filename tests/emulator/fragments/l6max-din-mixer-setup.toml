[[step]]
action = "include"
path = "tests/emulator/fragments/l6max-first-boot-setup.toml"

[[step]]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "usb-descriptors"
# Covers firmware starting its USB controller after boot.
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "usb-sysex-begin"
guest_timeout_ms = 15000
wall_timeout_s = 120

[[step]]
action = "usb-sysex-exchange"
bytes = [240, 126, 0, 6, 1, 247]
expect_prefix = [240, 126]

[[step]]
action = "usb-sysex-exchange"
bytes = [240, 82, 0, 0, 43, 247]
expect_prefix = [240, 82, 0, 0, 42]
min_reply_bytes = 182

[[step]]
action = "usb-sysex-exchange"
bytes = [240, 82, 0, 0, 49, 3, 1, 247]
expect_reply = true

[[step]]
action = "usb-sysex-end"
