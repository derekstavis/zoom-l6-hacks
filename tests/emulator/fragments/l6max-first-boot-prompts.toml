[[step]]
setup_input = true
models = ["l6max"]
action = "wait"
until = "boot-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
setup_input = true
models = ["l6max"]
action = "expect-display-image"
image = "tests/smoke/images/l6max-fresh-date-time.png"

# Confirm the startup prompts. A state spec boots without them.
[[step]]
setup_input = true
models = ["l6max"]
action = "press"
control = "recorder-function-4"
guest_timeout_ms = 10000
wall_timeout_s = 60

[[step]]
setup_input = true
models = ["l6max"]
action = "expect-display-image"
image = "tests/smoke/images/l6max-fresh-battery-type.png"

[[step]]
setup_input = true
models = ["l6max"]
action = "press"
control = "recorder-function-4"
guest_timeout_ms = 10000
wall_timeout_s = 60
