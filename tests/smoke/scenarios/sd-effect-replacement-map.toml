version = 1
name = "sd-effect-replacement-map"
models = ["l6max"]
backends = ["headless"]
state = "dual-efx-room"
card = "empty"
sd_patches = []
sd_bundle_mode = "composed-module"
effect_replacements = { room = "velvet" }
gdb = true

[[audio_input]]
channel = 1
loop-tone = { hz = 440.0, seconds = 1.0, amplitude = 0.1 }

[[step]]
action = "audio-input-transport"
command = "play"

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "expect-heap"
minimum_free = 131072

[[step]]
action = "delay"
guest_ms = 5000
guest_timeout_ms = 10000
wall_timeout_s = 60

[[step]]
action = "select-mode"
mode = "efx"

[[step]]
action = "dual-efx-state"
expected_effect_type = 1
expected_processor_type = 1

[[step]]
action = "press"
control = "efx-select"

[[step]]
action = "delay"
guest_ms = 500

[[step]]
action = "dual-efx-state"
expected_effect_type = 2
expected_processor_type = 0
