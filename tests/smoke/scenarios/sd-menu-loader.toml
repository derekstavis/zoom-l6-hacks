version = 1
name = "sd-menu-loader"
models = ["l6max"]
backends = ["headless"]
state = "setup-complete"
card = "empty"
patches = ["menu-loader", "knob-dialog"]
sd_patches = ["midi-sync"]

[[step]]
action = "wait"
until = "mixer-ready"
guest_timeout_ms = 60000
wall_timeout_s = 300

[[step]]
action = "delay"
guest_ms = 8000
guest_timeout_ms = 20000
wall_timeout_s = 300

[[step]]
action = "checkpoint"
name = "home"

[[step]]
action = "expect-sd-patch"
loaded = true

# Menu > System (main menu index 7).

[[step]]
action = "press"
control = "recorder-function-1"

[[step]]
action = "delay"
guest_ms = 1500

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "delay"
guest_ms = 500

[[step]]
action = "press"
control = "recorder-function-4"

[[step]]
action = "delay"
guest_ms = 1000

# System index 7 is Patches, after the seven stock items.

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "delay"
guest_ms = 500

[[step]]
action = "checkpoint"
name = "system-patches"

[[step]]
action = "expect-display-image"
image = "tests/smoke/images/menu-loader/system-patches.png"

[[step]]
action = "press"
control = "recorder-function-4"

[[step]]
action = "delay"
guest_ms = 1000

[[step]]
action = "checkpoint"
name = "patches-top"

[[step]]
action = "expect-display-image"
image = "tests/smoke/images/menu-loader/patches-top.png"

# Down three times scrolls the list to rows 1-3; Up then selects
# knob-dialog, leaving the SD module's row visible and unselected, so its
# long title does not scroll.

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "press"
control = "recorder-function-2"

[[step]]
action = "delay"
guest_ms = 1000

[[step]]
action = "checkpoint"
name = "patches-sd-row"

[[step]]
action = "expect-display-image"
image = "tests/smoke/images/menu-loader/patches-sd-row.png"

# Back to System; midi-sync declares the item after Patches.

[[step]]
action = "press"
control = "recorder-function-1"

[[step]]
action = "delay"
guest_ms = 1000

[[step]]
action = "press"
control = "recorder-function-3"

[[step]]
action = "delay"
guest_ms = 1000

[[step]]
action = "checkpoint"
name = "system-send-midi-state"

[[step]]
action = "expect-display-image"
image = "tests/smoke/images/menu-loader/system-send-midi-state.png"
