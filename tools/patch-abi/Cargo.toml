[package]
name = "patch-abi"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["alloc"]
# The host-side writers. The Patch loader includes `src/lib.rs` directly and
# builds without them.
alloc = ["dep:sha2"]

[dependencies]
sha2 = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true
